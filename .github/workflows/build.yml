name: Build unsigned IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen generate
      - run: |
          xcodebuild -project GitZipper.xcodeproj -scheme GitZipper -configuration Release \
            -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir Payload && cp -R build/Build/Products/Release-iphoneos/GitZipper.app Payload/
          zip -qr GitZipper-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: {name: GitZipper-unsigned-ipa, path: GitZipper-unsigned.ipa}
