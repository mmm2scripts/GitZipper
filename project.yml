name: GitZipper
options: {bundleIdPrefix: com.gitzipper, deploymentTarget: {iOS: "16.0"}}
packages:
  ZIPFoundation: {url: "https://github.com/weichsel/ZIPFoundation", from: "0.9.19"}
targets:
  GitZipper:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    dependencies: [{package: ZIPFoundation}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gitzipper.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: GitZipper
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_VERSION: "5.0"
